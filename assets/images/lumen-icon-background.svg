<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- LumenAI adaptive-icon BACKGROUND.
       Just the teal gradient field. Sits behind the foreground glyph in
       Android's adaptive-icon system. -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#22D3CC" />
      <stop offset="55%"  stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#0E7490" />
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg-grad)" />
</svg>
